name: "🛰️ ENGINE // AUTOMATED PRODUCTION BACKUP & CLEANUP PIPELINE"

on:
  push:
    branches:
      - prod # Triggers the split second code hits your production branch

jobs:
  create-and-clean-backups:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the server bot permission to create and delete remote branches
    steps:
      - name: "Clone Repository Code Matrix"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full repository branch history logs

      - name: "Generate Backup & Prune Old Backups"
        run: |
          # 1. Set up clean system identity profiles for the GitHub Actions bot
          git config --global user.name "AstraCube Automation Bot"
          git config --global user.email "actions@github.com"
          
          # 2. Forge a highly unique timestamp variable matching your system clock runtime
          TIMESTAMP=$(date +'%Y-%m-%d-%H%M%S')
          BACKUP_NAME="prod-backup-$TIMESTAMP"
          
          # 3. Create a perfect clone branch pointing directly to the commit right BEFORE your push
          # 'prod^' targets the exact previous commit parent node on the line
          git branch $BACKUP_NAME prod^
          
          # 4. Stream the new backup branch safely up to your online remote dashboard
          git push origin $BACKUP_NAME
          echo ">> SUCCESS: Rollback safety net branch ($BACKUP_NAME) secured on remote."

          # =========================================================================
          # 🧹 THE AUTOMATED BACKUP CLEANUP RECYCLE BLOCK
          # =========================================================================
          echo ">> Initializing sliding-window cleanup tracker..."
          
          # A. Fetch and refresh all remote tracking logs from GitHub
          git fetch --prune
          
          # B. List all remote branches matching our 'prod-backup-' prefix, 
          # sort them chronologically by author date, and store their clean names in an array
          BACKUPS=($(git branch -r --sort=authordate | grep "origin/prod-backup-" | sed 's/origin\///g' | xargs))
          
          TOTAL_BACKUPS=${#BACKUPS[@]}
          MAX_ALLOWED=3
          
          echo "Total backup branches currently detected on remote: $TOTAL_BACKUPS"

          # C. If our total backup count exceeds our maximum allowed window, 
          # calculate how many loops we need and delete the oldest entries from remote!
          if [ $TOTAL_BACKUPS -gt $MAX_ALLOWED ]; then
            NUM_TO_DELETE=$((TOTAL_BACKUPS - MAX_ALLOWED))
            echo "Breached capacity limit. Pruning oldest $NUM_TO_DELETE backup(s)..."
            
            for ((i=0; i<$NUM_TO_DELETE; i++)); do
              OLD_BACKUP_NAME=${BACKUPS[$i]}
              echo "Recycling old cluster: Deleting $OLD_BACKUP_NAME from remote..."
              git push origin --delete $OLD_BACKUP_NAME
            done
            echo ">> CLEANUP COMPLETE: Repository branch registry re-stabilized."
          else
            echo ">> STATUS NOMINAL: Total backups within safe margins. No pruning required."
          fi
